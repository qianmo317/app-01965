# Docker Compose configuration for Tetris AI Game
# Run with: docker-compose up --build -d

services:
  # Frontend User Service - HTML5 Tetris Game with AI
  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: tetris-ai-game
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - "app=tetris-ai-game"
      - "service=frontend-user"

networks:
  default:
    name: tetris-network
